    <script>
      // Swallow benign Vite HMR WebSocket disconnect errors when HMR is disabled in AI Studio iframe
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('vite'))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason.message || '').includes('WebSocket'))) {
          e.preventDefault();
        }
      });
    </script>
