"0.25rem",xl:"0.5rem",full:"0.75rem"},spacing:{"gutter-desktop":"1.5rem","space-2xl":"2rem","space-sm":"0.5rem",gutter:"1rem","space-md":"0.75rem","space-xs":"0.25rem","space-3xl":"3rem","space-xl":"1.5rem","space-lg":"1rem","margin-desktop":"2.5rem",margin:"1rem"},fontFamily:{"title-md":["DM Sans"],"body-lg":["DM Sans"],"body-sm":["DM Sans"],"headline-lg":["Noto Serif"],"headline-sm":["Noto Serif"],"headline-lg-mobile":["Noto Serif"],"label-lg":["DM Sans"],"body-md":["DM Sans"],"title-lg":["DM Sans"],"headline-md":["Noto Serif"],"label-md":["DM Sans"],display:["Noto Serif"]},fontSize:{"title-md":["1rem",{lineHeight:"1.5rem",fontWeight:"600"}],"body-lg":["1.125rem",{lineHeight:"1.75rem",fontWeight:"400"}],"body-sm":["0.875rem",{lineHeight:"1.375rem",fontWeight:"400"}],"headline-lg":["2.25rem",{lineHeight:"2.75rem",letterSpacing:"-0.015em",fontWeight:"400"}],"headline-sm":["1.25rem",{lineHeight:"1.75rem",fontWeight:"400"}],"headline-lg-mobile":["1.75rem",{lineHeight:"2.25rem",letterSpacing:"-0.01em",fontWeight:"400"}],"label-lg":["0.875rem",{lineHeight:"1.25rem",letterSpacing:"0.01em",fontWeight:"600"}],"body-md":["1rem",{lineHeight:"1.5rem",fontWeight:"400"}],"title-lg":["1.125rem",{lineHeight:"1.625rem",fontWeight:"600"}],"headline-md":["1.5rem",{lineHeight:"2rem",fontWeight:"400"}],"label-md":["0.75rem",{lineHeight:"1rem",letterSpacing:"0.02em",fontWeight:"600"}],display:["3rem",{lineHeight:"3.5rem",letterSpacing:"-0.02em",fontWeight:"400"}]}}}}</script></head><body class="bg-surface text-on-surface min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin py-space-xl"><div class="flex flex-col w-full">
<div class="flex flex-col items-center text-center space-y-space-xs mb-space-lg">
<div class="relative w-40 h-40 mb-space-xs flex items-center justify-center">
<img alt="JanmaSaathi emblem" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD4KjZSBar9CC1Xey5dzD6eGeX-UGjvG2nGA1rympD-fWOApUVVcEsaD0UXJLBVcrqusHaM7tAmc8xj3en46A1h0htfhgEsUxx2tCOyXtCXvRqc7kJVOKO1ydT8j6T2jCCTeJBKmc-xYPBImfgChuldAUiWKGWm9EbjqpkYmkIfNnA92U5ryyhLch5I_weFsBny5jHHJ0YWeryQuDku2hHSiJ8RdVbtlDIil_ACOMP_rPX5TLfTCN2ymd1rZ5V9TdB9">
</div>
<div class="flex flex-col items-center">

<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Your companion for safer motherhood.</p>
</div>
<div class="pt-space-xs"><div class="w-full max-w-sm mx-auto p-1 bg-surface-container-low rounded-xl flex items-center justify-between gap-1 shadow-sm"><button type="button" class="flex-1 py-2 px-2 text-center rounded-lg font-label-md text-label-md text-[#30232A] hover:bg-surface-container transition-colors">Mother</button><button type="button" class="flex-1 py-2 px-2 text-center rounded-lg font-label-md text-label-md text-[#30232A] hover:bg-surface-container transition-colors">Health Worker</button><button type="button" class="flex-1 py-2 px-2 text-center rounded-lg font-label-md text-label-md bg-[#890149] text-[#F3F3E7] font-semibold shadow-sm">Supervisor</button></div></div>
</div>
<div class="flex flex-col mb-space-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1">
      Welcome, Supervisor.
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
      Sign in to monitor maternal healthcare activities and manage your healthcare network.
    </p>
</div>
<form class="flex flex-col space-y-space-lg" onsubmit="event.preventDefault();">
<div class="flex flex-col space-y-1.5">
<label class="font-label-lg text-label-lg text-on-surface" for="supervisor-id">
        Supervisor ID
      </label>
<div class="relative flex items-center">
<input autocomplete="username" class="w-full h-12 px-space-lg rounded-xl bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md focus:outline-none focus:bg-surface-container focus:ring-1 focus:ring-primary transition-colors" id="supervisor-id" placeholder="Enter your registered ID" type="text">
<span class="absolute right-3 text-on-surface-variant/70 material-symbols-outlined text-[20px]">
          badge
        </span>
</div>
</div>
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface" for="supervisor-password">
          Password
        </label>
<button class="font-label-md text-label-md text-primary font-semibold hover:underline" type="button">
          Forgot Password?
        </button>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-12 pl-space-lg pr-12 rounded-xl bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md focus:outline-none focus:bg-surface-container focus:ring-1 focus:ring-primary transition-colors" id="supervisor-password" placeholder="Enter your password" type="password">
<button aria-label="Toggle password visibility" class="absolute right-1 w-11 h-11 flex items-center justify-center text-on-surface-variant focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<button class="w-full h-12 bg-primary-container text-surface-bright rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-2 active:opacity-90 shadow-sm transition-opacity mt-space-xs" type="submit">
<span class="">Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>

<div class="mt-space-2xl text-center pb-space-lg">
<p class="font-body-sm text-body-sm text-on-surface-variant">
      Need help signing in? 
      <a class="text-primary font-semibold hover:underline" href="#admin-contact">Contact District Health Administrator</a> 
      or 
      <a class="text-primary font-semibold hover:underline" href="#helpdesk">Helpdesk</a>.
    </p>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('supervisor-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isHidden = pwdInput.type === 'password';
        pwdInput.type = isHidden ? 'text' : 'password';
        eyeIcon.textContent = isHidden ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main>


</body></html>
