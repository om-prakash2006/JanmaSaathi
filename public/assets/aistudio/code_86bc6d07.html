"0.25rem",xl:"0.5rem",full:"0.75rem"},spacing:{"gutter-desktop":"1.5rem","space-2xl":"2rem","space-sm":"0.5rem",gutter:"1rem","space-md":"0.75rem","space-xs":"0.25rem","space-3xl":"3rem","space-xl":"1.5rem","space-lg":"1rem","margin-desktop":"2.5rem",margin:"1rem"},fontFamily:{"title-md":["DM Sans"],"body-lg":["DM Sans"],"body-sm":["DM Sans"],"headline-lg":["Noto Serif"],"headline-sm":["Noto Serif"],"headline-lg-mobile":["Noto Serif"],"label-lg":["DM Sans"],"body-md":["DM Sans"],"title-lg":["DM Sans"],"headline-md":["Noto Serif"],"label-md":["DM Sans"],display:["Noto Serif"]},fontSize:{"title-md":["1rem",{lineHeight:"1.5rem",fontWeight:"600"}],"body-lg":["1.125rem",{lineHeight:"1.75rem",fontWeight:"400"}],"body-sm":["0.875rem",{lineHeight:"1.375rem",fontWeight:"400"}],"headline-lg":["2.25rem",{lineHeight:"2.75rem",letterSpacing:"-0.015em",fontWeight:"400"}],"headline-sm":["1.25rem",{lineHeight:"1.75rem",fontWeight:"400"}],"headline-lg-mobile":["1.75rem",{lineHeight:"2.25rem",letterSpacing:"-0.01em",fontWeight:"400"}],"label-lg":["0.875rem",{lineHeight:"1.25rem",letterSpacing:"0.01em",fontWeight:"600"}],"body-md":["1rem",{lineHeight:"1.5rem",fontWeight:"400"}],"title-lg":["1.125rem",{lineHeight:"1.625rem",fontWeight:"600"}],"headline-md":["1.5rem",{lineHeight:"2rem",fontWeight:"400"}],"label-md":["0.75rem",{lineHeight:"1rem",letterSpacing:"0.02em",fontWeight:"600"}],display:["3rem",{lineHeight:"3.5rem",letterSpacing:"-0.02em",fontWeight:"400"}]}}}}</script></head><body class="bg-surface text-on-surface min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin py-space-xl"><div class="flex flex-col w-full max-w-[390px] mx-auto px-4 py-2 pb-8">
<div class="flex flex-col items-center text-center mt-2 mb-6">
<div class="w-44 h-44 flex items-center justify-center"><img alt="JanmaSaathi Emblem" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqcYasAZML1Fa6KJkcwGoVOSGmdPcfbjGn7Jy9ApOU4vL1Tfw3LJlOSd57TLN83HqWSbsIB3J9Xrp1PlOOsjoe6fEVZvi3OksqRLpZCBFSOkiYgXaiRC0ko_Dcm0zlbhZVdvO4XfiZ8EIAnwMNUAweTpebdW9R7_As01emoQ0Klj0hsF42cqnda7XS_bj0lbvFsDobCJJVlkWEAZxf1fZpvPgda2Q5R4ibnXahKqJqKT3Xu_p5E8oRgwSsWDBU1YuF"></div>

<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[260px]">
      Your companion for safer motherhood.
    </p>
</div>
<div aria-label="Select User Role" class="w-full bg-surface-container-high p-1 rounded-xl flex items-center justify-between mb-6 shadow-sm" role="tablist">
<button aria-selected="true" class="flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-150 bg-primary-container text-on-primary" id="tab-patient" onclick="selectRole('patient')" role="tab" type="button">Mother</button>
<button aria-selected="false" class="flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-150 text-on-surface hover:text-primary" id="tab-asha" onclick="selectRole('asha')" role="tab" type="button">Health Worker</button>
<button aria-selected="false" class="flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-150 text-on-surface hover:text-primary" id="tab-supervisor" onclick="selectRole('supervisor')" role="tab" type="button">Supervisor</button>
</div><div class="flex flex-col mb-5">
<h1 class="font-headline-sm text-headline-sm text-on-surface mb-1" id="signin-heading">
      Sign in to JanmaSaathi
    </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant min-h-[44px]" id="role-context-text">Welcome back. Access your pregnancy care journey, antenatal visit schedule, and care guides.</p>
</div>

<form class="flex flex-col space-y-4" id="signin-form" onsubmit="event.preventDefault();">
<div class="flex flex-col space-y-1">
<label class="font-label-lg text-label-lg text-on-surface" for="identity-input" id="identity-label">Email Address</label>
<div class="relative w-full">
<input autocomplete="username" class="w-full h-12 px-3 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-sm" id="identity-input" placeholder="name@example.com" required="" type="email">
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant hidden mt-0.5" id="identity-helper"></p>
</div>
<div class="flex flex-col space-y-1">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface" for="password-input">
          Password
        </label>
<button class="font-label-md text-label-md text-primary-container hover:underline" onclick="alert('Please contact your Block Facility supervisor to reset your account password.')" type="button">
          Forgot Password?
        </button>
</div>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-12 pl-3 pr-11 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-sm" id="password-input" placeholder="Enter your secure password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 bottom-0 px-3 flex items-center justify-center text-outline hover:text-on-surface" id="toggle-password-btn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-visibility-icon">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full h-12 bg-primary-container text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2" id="submit-button" type="submit">
<span class="">Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>

<footer class="mt-6 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
      Need help signing in? <a class="text-primary-container font-semibold underline" href="tel:104">Contact your Block ASHA Facilitator</a> or Health Helpdesk.
    </p>
</footer>
</div>
<script>
  const roleConfigs = {
    patient: {
      description: "Welcome back. Access your pregnancy care journey, antenatal visit schedule, and care guides.",
      label: "Email Address",
      placeholder: "name@example.com",
      type: "email",
      helper: ""
    },
    asha: {
      description: "ASHA Field Portal. Access your community maternal registry, antenatal visit checklists, and risk assessments.",
      label: "ASHA ID / Staff Code",
      placeholder: "e.g., ASHA-MH-40192",
      type: "text",
      helper: "Assigned by your Block Primary Health Centre."
    },
    supervisor: {
      description: "Supervisory Network. Monitor regional maternal health cases, PHC referral queues, and health worker reports.",
      label: "Supervisor ID / Staff Code",
      placeholder: "e.g., SUP-DIST-1082",
      type: "text",
      helper: "District Health Administration credential."
    }
  };

  let activeRole = 'patient';

  function selectRole(roleKey) {
    activeRole = roleKey;
    const config = roleConfigs[roleKey];

    // Update segmented control tabs
    ['patient', 'asha', 'supervisor'].forEach(role => {
      const tab = document.getElementById('tab-' + role);
      if (role === roleKey) {
        tab.className = "flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-150 bg-primary-container text-on-primary";
        tab.setAttribute('aria-selected', 'true');
      } else {
        tab.className = "flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-150 text-on-surface hover:text-primary";
        tab.setAttribute('aria-selected', 'false');
      }
    });

    // Update dynamic text & field states
    document.getElementById('role-context-text').textContent = config.description;
    document.getElementById('identity-label').textContent = config.label;
    
    const input = document.getElementById('identity-input');
    input.placeholder = config.placeholder;
    input.type = config.type;
    input.value = "";

    const helper = document.getElementById('identity-helper');
    if (config.helper) {
      helper.textContent = config.helper;
      helper.classList.remove('hidden');
    } else {
      helper.textContent = "";
      helper.classList.add('hidden');
    }
  }

  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password-input');
    const icon = document.getElementById('password-visibility-icon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main>



</body></html>
